# Configuración exclusiva de las pruebas automatizadas: base de datos H2 en memoria
# (modo compatible con PostgreSQL) para no depender del servidor real ni tocar sus datos.
spring.application.name=api-test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
